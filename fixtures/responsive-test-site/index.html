<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture Responsive Fixture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Fixture for the Responsive/State Lab (Part III §10): several explicit
  CSS breakpoints at round numbers (390/768/1024/1440, matching the spec's
  own example widths) so "Create panes from page breakpoints" auto-discovery
  has real media queries to parse, plus content that visibly rearranges at
  each breakpoint so a human or a screenshot diff can confirm it worked.
-->
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(1, 1fr);
    gap: 12px;
  }
  .gallery .item {
    background: #4D6BFF;
    color: white;
    border-radius: 8px;
    padding: 24px;
    text-align: center;
  }

  .breakpoint-label::before {
    content: "Breakpoint: base (<390px)";
    display: block;
    font-weight: 700;
    margin-bottom: 12px;
  }

  @media (min-width: 390px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
    .breakpoint-label::before { content: "Breakpoint: 390px+"; }
  }
  @media (min-width: 768px) {
    .gallery { grid-template-columns: repeat(3, 1fr); }
    .breakpoint-label::before { content: "Breakpoint: 768px+"; }
  }
  @media (min-width: 1024px) {
    .gallery { grid-template-columns: repeat(4, 1fr); }
    .breakpoint-label::before { content: "Breakpoint: 1024px+"; }
  }
  @media (min-width: 1440px) {
    .gallery { grid-template-columns: repeat(6, 1fr); }
    .breakpoint-label::before { content: "Breakpoint: 1440px+"; }
  }

  @media (prefers-color-scheme: dark) {
    body { background: #11131A; color: #f5f5f5; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .item { transition: transform 0.2s ease; }
    .item:hover { transform: translateY(-2px); }
  }
</style>
</head>
<body>
  <p class="breakpoint-label"></p>
  <section class="gallery" data-testid="responsive-gallery">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
  </section>

  <p>Viewport: <span id="viewport-readout"></span></p>
  <script>
    function updateReadout() {
      document.getElementById("viewport-readout").textContent =
        window.innerWidth + " x " + window.innerHeight + " @" + window.devicePixelRatio + "x";
    }
    updateReadout();
    window.addEventListener("resize", updateReadout);
  </script>
</body>
</html>
