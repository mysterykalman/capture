<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Capture</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1b1e25;
      background: #ffffff;
    }
    h1 {
      font-size: 13px;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f3f4f7;
      margin-bottom: 12px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9aa0ab;
      flex: none;
    }
    .dot.connected { background: #2fb35b; }
    .dot.connecting { background: #e0a72f; }
    .dot.disconnected { background: #e0522f; }
    .status-text { font-size: 12px; }
    .status-detail { font-size: 11px; color: #6a707c; margin-top: 2px; }
    button {
      width: 100%;
      padding: 9px 10px;
      border: none;
      border-radius: 8px;
      background: #2f6fed;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #275bc4; }
    button:disabled { background: #b7c3e0; cursor: default; }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #6a707c;
    }
    a { color: #2f6fed; }
  </style>
</head>
<body>
  <h1>Capture Browser Bridge</h1>
  <div class="status">
    <span class="dot" id="status-dot"></span>
    <div>
      <div class="status-text" id="status-text">Checking connection…</div>
      <div class="status-detail" id="status-detail"></div>
    </div>
  </div>
  <button id="inspect-btn">Inspect this page</button>
  <div class="hint">Or press the Inspect Page shortcut (see Options) on any tab.</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
